{% extends "base.html" %}
{% block title %}Мои договоры{% endblock %}

{% block content %}
<div class="card">
  <div class="row-between">
    <div>
      <h1>Мои договоры</h1>
      <p class="muted">Список из /contracts/my</p>
    </div>
    <a class="btn btn--ghost" href="/catalog">В каталог</a>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Статус</th>
          <th>Пункт</th>
          <th>Начало</th>
          <th>План конец</th>
          <th>Факт конец</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="myContractsTbody">
        <tr><td colspan="7" class="muted">Загрузка…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="contractsMsg" class="msg"></div>
</div>
{% endblock %}
