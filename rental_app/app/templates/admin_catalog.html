{% extends "base.html" %}
{% block title %}Админ: Каталог{% endblock %}

{% block content %}
<div class="card" id="adminCatalogPage">
  <h1>Админ: Каталог</h1>
  <p class="muted">Категории и продукты (CRUD через /admin/*).</p>

  <div class="hr"></div>

  <h2>Категории</h2>
  <div class="grid2">
    <div>
      <label>category_id (для редактирования)</label>
      <input id="admCatId" type="number" placeholder="пусто = создать" />
    </div>
    <div>
      <label>name</label>
      <input id="admCatName" type="text" />
    </div>
    <div>
      <label>description</label>
      <input id="admCatDesc" type="text" />
    </div>
    <div class="filters__actions">
      <button class="btn btn--primary" id="admCatSaveBtn">Сохранить</button>
      <button class="btn" id="admCatResetBtn">Сброс</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr><th>ID</th><th>name</th><th>description</th><th></th></tr>
      </thead>
      <tbody id="admCatTbody">
        <tr><td colspan="4" class="muted">Загрузка…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="admCatMsg" class="msg"></div>

  <div class="hr"></div>

  <h2>Продукты</h2>
  <div class="grid2">
    <div>
      <label>product_id (для редактирования)</label>
      <input id="admProdId" type="number" placeholder="пусто = создать" />
    </div>
    <div>
      <label>category_id</label>
      <select id="admProdCategory"></select>
    </div>
    <div>
      <label>name</label>
      <input id="admProdName" type="text" />
    </div>
    <div>
      <label>brand</label>
      <input id="admProdBrand" type="text" />
    </div>
    <div>
      <label>description</label>
      <input id="admProdDesc" type="text" />
    </div>
    <div>
      <label>volume_liters</label>
      <input id="admProdVol" type="number" min="0" />
    </div>
    <div>
      <label>people_count</label>
      <input id="admProdPeople" type="number" min="1" />
    </div>
    <div>
      <label>temperature_min</label>
      <input id="admProdTemp" type="number" step="1" />
    </div>
    <div>
      <label>default_daily_price</label>
      <input id="admProdPrice" type="number" min="0" step="0.01" />
    </div>
    <div>
      <label>default_deposit</label>
      <input id="admProdDeposit" type="number" min="0" step="0.01" />
    </div>
    <div class="filters__actions">
      <button class="btn btn--primary" id="admProdSaveBtn">Сохранить</button>
      <button class="btn" id="admProdResetBtn">Сброс</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr><th>ID</th><th>name</th><th>category</th><th>price</th><th>deposit</th><th></th></tr>
      </thead>
      <tbody id="admProdTbody">
        <tr><td colspan="6" class="muted">Загрузка…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="admProdMsg" class="msg"></div>
</div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='js/admin.js') }}"></script>
{% endblock %}
