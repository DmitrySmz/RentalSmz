<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Rental App{% endblock %}</title>

  <!-- ВАЖНО: только через /static (а не /Users/...) -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <a href="/">Rental</a>
      </div>

      <nav class="nav">
        <a href="/">Каталог</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/login">Вход</a>
        <a href="/register">Регистрация</a>
        <a href="#" id="logoutLink">Выход</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <small>Session idle: 2 min (см. требования)</small>
    </div>
  </footer>

  <!-- ВАЖНО: тоже через /static -->
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
</body>
</html>
