

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host ${APP_HOST} --port ${APP_PORT}
      "
      

  apache:
    image: httpd:2.4
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./apache.conf:/usr/local/apache2/conf/httpd.conf:ro

volumes:
  pgdata:
